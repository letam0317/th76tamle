<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form Audit - Kiểm soát kho 5S</title>

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js (CDN) - defer để chạy sau khi DOM tải xong -->
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- Thư viện quét mã vạch / QR (CDN) — defer: chỉ dùng khi bấm quét, không chặn hiển thị form -->
  <script defer src="https://unpkg.com/html5-qrcode"></script>

  <style>
    /* Cuộn mượt cho danh sách dropdown */
    .dropdown-scroll { scrollbar-width: thin; }
    .dropdown-scroll::-webkit-scrollbar { width: 6px; }
    .dropdown-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    [x-cloak] { display: none !important; }
  </style>
</head>

<body class="bg-slate-100 min-h-screen py-6 px-4">

  <!--
    ===========================================================
    HƯỚNG DẪN NHANH (dành cho người dùng):
    1. Mở file google-script.gs, làm theo hướng dẫn để lấy đường link Web App.
    2. Dán đường link đó vào biến WEBHOOK_URL ở cuối file này (phần <script>).
    3. Mở file index.html này bằng trình duyệt (nên dùng điện thoại để quét mã & chụp ảnh).
       * Lưu ý: Camera chỉ bật được khi mở qua https:// hoặc localhost (yêu cầu bảo mật của trình duyệt).
    ===========================================================
  -->

  <div
    x-data="auditForm()"
    class="max-w-xl mx-auto"
  >
    <!-- (Đã bỏ khối tiêu đề để pop-up gọn — tiêu đề đã có ở thanh modal của dashboard) -->

    <!-- Thẻ chứa form -->
    <form
      @submit.prevent="guiBaoCao()"
      class="bg-white rounded-3xl shadow-lg shadow-slate-200 p-6 sm:p-8 space-y-6"
    >

      <!-- ===== MỤC 1: Nhân viên vi phạm (Searchable Multi-select Dropdown 4 Cột Khoá Cứng) ===== -->
      <div @click.outside="moDropdownNV = false">
        <label class="block text-sm font-semibold text-slate-700 mb-2">1. Nhân viên vi phạm</label>

        <div class="relative">
          <input
            type="text"
            x-model="tuKhoaNV"
            @focus="moDropdownNV = true"
            @input="moDropdownNV = true"
            placeholder="Gõ tên, ID, email hoặc nghiệp vụ để tìm (vd: tamlc, 233135, Đóng gói)..."
            class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-800 placeholder-slate-400 focus:border-blue-400 focus:ring-2 focus:ring-blue-100 focus:outline-none transition"
          />

          <!-- Dropdown gợi ý 4 CỘT vừa vặn khung form (Zero Overflow) -->
          <div
            x-show="moDropdownNV && tuKhoaNV.trim().length > 0"
            x-cloak
            class="absolute z-20 mt-1 w-full max-h-72 overflow-y-auto dropdown-scroll rounded-2xl border border-slate-200 bg-white shadow-xl left-0"
          >
            <!-- Header 4 Cột Canh Thẳng Hàng gọn gàng -->
            <div x-show="danhSachLocNV().length > 0" class="sticky top-0 bg-slate-100 border-b border-slate-200 px-3 py-2 flex items-center gap-2 text-[11px] font-bold text-slate-600 uppercase tracking-wider z-10">
              <div class="flex-1 min-w-0 text-slate-800">Họ và tên</div>
              <div class="w-14 shrink-0 font-mono text-center">ID</div>
              <div class="w-32 shrink-0">Mail Hasaki</div>
              <div class="w-24 shrink-0 text-right">Nghiệp vụ</div>
            </div>

            <template x-for="(nv, idx) in danhSachLocNV()" :key="idx">
              <div
                @click="chonNV(nv)"
                class="px-3 py-2 hover:bg-blue-50 cursor-pointer border-b border-slate-100 last:border-0 flex items-center gap-2 text-xs transition"
              >
                <!-- Cột 1: HỌ VÀ TÊN (Chiếm phần lớn không gian, không bị trống thừa) -->
                <div class="flex-1 min-w-0 font-semibold text-slate-900 truncate" x-text="nv.name"></div>
                <!-- Cột 2: ID (Mã NV 6 số gọn gàng) -->
                <div class="w-14 shrink-0 font-mono text-slate-600 text-[11px] text-center" x-text="nv.code"></div>
                <!-- Cột 3: MAIL HASAKI (Gọn gàng) -->
                <div class="w-32 shrink-0 text-slate-500 font-mono text-[11px] truncate" x-text="nv.email"></div>
                <!-- Cột 4: NGHIỆP VỤ (Canh phải đẹp mắt) -->
                <div class="w-24 shrink-0 text-slate-600 text-[11px] truncate font-medium text-right bg-slate-50 px-1.5 py-0.5 rounded border border-slate-200" x-text="nv.dept"></div>
              </div>
            </template>

            <div x-show="danhSachLocNV().length === 0" class="px-4 py-3 text-sm text-slate-400 text-center">
              Không tìm thấy nhân viên phù hợp
            </div>
          </div>
        </div>

        <!-- Danh sách NV vi phạm đã chọn (nằm dưới ô nhập, màu sắc xanh lá giống Mục 3) -->
        <div x-show="form.nhanVienViPhamList && form.nhanVienViPhamList.length > 0" x-cloak class="mt-2.5 flex flex-wrap gap-1.5">
          <template x-for="(nv, idx) in form.nhanVienViPhamList" :key="idx">
            <div class="inline-flex items-center gap-1.5 rounded-xl bg-green-50 border border-green-200 px-3 py-1.5 text-xs text-green-700 shadow-sm">
              <span class="font-semibold text-green-700">✓ Đã chọn:</span>
              <span class="font-bold text-slate-900" x-text="nv.name"></span>
              <span class="text-slate-500 font-mono text-[11px]" x-text="'(' + nv.code + ' / ' + nv.email + (nv.dept ? ' / ' + nv.dept : '') + ')'"></span>
              <button type="button" @click="xoaNV(idx)" class="hover:bg-red-100 hover:text-red-600 text-slate-400 rounded-full w-4 h-4 inline-flex items-center justify-center font-bold ml-1 transition" title="Xóa">✕</button>
            </div>
          </template>
        </div>
      </div>

      

      <!-- ===== MỤC 2: Khu vực / vị trí + nút quét mã vạch ===== -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">
          2. Khu vực hoặc vị trí ghi nhận <span class="text-red-500">*</span>
        </label>
        <div class="flex gap-2">
          <input
            type="text"
            x-model="form.viTri"
            placeholder="Nhập hoặc quét mã vạch vị trí..."
            class="flex-1 rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-800 placeholder-slate-400 focus:border-blue-400 focus:ring-2 focus:ring-blue-100 focus:outline-none transition"
          />
          <!-- Nút bật camera quét mã -->
          <button
            type="button"
            @click="moCamera()"
            title="Quét mã vạch / QR"
            class="shrink-0 w-12 h-12 flex items-center justify-center rounded-2xl bg-blue-600 text-white hover:bg-blue-700 active:scale-95 transition"
          >
            <!-- Icon mã vạch -->
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 5h2v14H3V5zm4 0h1v14H7V5zm3 0h2v14h-2V5zm4 0h1v14h-1V5zm3 0h2v14h-2V5z"/>
            </svg>
          </button>
        </div>

        <!-- Khung hiển thị camera khi quét (dùng chung cho Vị trí + Mã sản phẩm) -->
        <div x-show="dangQuet" x-cloak class="mt-3 rounded-2xl overflow-hidden border border-slate-200 bg-black">
          <div id="reader" class="w-full"></div>
          <button
            type="button"
            @click="dongCamera()"
            class="w-full py-2.5 bg-slate-800 text-white text-sm font-medium hover:bg-slate-700 transition"
          >
            Đóng camera
          </button>
        </div>
      </div>

      <!-- ===== MỤC 3: Mã sản phẩm (KHÔNG bắt buộc) — nhập tay hoặc quét barcode/QR ===== -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">
          3. Mã sản phẩm <span class="text-xs font-normal text-slate-400">(không bắt buộc)</span>
        </label>
        <div class="flex gap-2">
          <input
            type="text"
            x-model="form.maSanPham"
            placeholder="Nhập hoặc quét mã vạch sản phẩm..."
            class="flex-1 rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-800 placeholder-slate-400 focus:border-blue-400 focus:ring-2 focus:ring-blue-100 focus:outline-none transition"
          />
          <button
            type="button"
            @click="moCamera('maSanPham')"
            title="Quét mã vạch / QR sản phẩm"
            class="shrink-0 w-12 h-12 flex items-center justify-center rounded-2xl bg-blue-600 text-white hover:bg-blue-700 active:scale-95 transition"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 5h2v14H3V5zm4 0h1v14H7V5zm3 0h2v14h-2V5zm4 0h1v14h-1V5zm3 0h2v14h-2V5z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- ===== MỤC 4: Hạng mục 5S (Searchable Dropdown) ===== -->
      <div x-data="{ }" @click.outside="moDropdown = false">
        <label class="block text-sm font-semibold text-slate-700 mb-2">
          4. Thuộc hạng mục <span class="text-red-500">*</span>
        </label>
        <div class="relative">
          <input
            type="text"
            x-model="tuKhoa"
            @focus="moDropdown = true"
            @input="moDropdown = true"
            placeholder="Gõ để tìm (ví dụ: hsd, fefo, rác...)"
            class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-800 placeholder-slate-400 focus:border-blue-400 focus:ring-2 focus:ring-blue-100 focus:outline-none transition"
          />

          <!-- Danh sách kết quả lọc -->
          <div
            x-show="moDropdown"
            x-cloak
            class="absolute z-20 mt-1 w-full max-h-72 overflow-y-auto dropdown-scroll rounded-2xl border border-slate-200 bg-white shadow-xl"
          >
            <template x-for="(muc, idx) in danhSachLoc()" :key="idx">
              <div
                @click="chonHangMuc(muc)"
                class="px-4 py-3 text-sm text-slate-700 hover:bg-blue-50 cursor-pointer border-b border-slate-100 last:border-0"
                :class="{ 'bg-blue-50 font-medium': form.hangMuc === muc }"
                x-text="muc"
              ></div>
            </template>
            <div x-show="danhSachLoc().length === 0" class="px-4 py-3 text-sm text-slate-400">
              Không tìm thấy hạng mục phù hợp
            </div>
          </div>
        </div>

        <!-- Hạng mục đã chọn -->
        <p x-show="form.hangMuc" x-cloak class="mt-2 text-xs text-green-600">
          ✓ Đã chọn: <span x-text="form.hangMuc" class="font-medium"></span>
        </p>
      </div>

      <!-- ===== MỤC 5: Hiện trạng (Ghi chú, không bắt buộc) ===== -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">
          5. Hiện trạng (ghi chú)
        </label>
        <textarea
          x-model="form.hienTrang"
          :rows="hangDong"
          placeholder="Mô tả nhanh hiện trạng ghi nhận (không bắt buộc)..."
          class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-800 placeholder-slate-400 focus:border-blue-400 focus:ring-2 focus:ring-blue-100 focus:outline-none transition"
        ></textarea>
      </div>

      

      

      <!-- ===== MỤC 6: Hình ảnh / clip ===== -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">
          6. Hình ảnh / clip tại thời điểm ghi nhận <span class="text-red-500">*</span>
        </label>

        <div class="grid grid-cols-2 gap-2">
          <!-- Nút CHỤP ẢNH TRỰC TIẾP (mở camera live trong trang) -->
          <button
            type="button"
            @click="moChupAnh()"
            class="flex flex-col items-center justify-center rounded-2xl border-2 border-blue-300 bg-blue-50 px-3 py-6 hover:bg-blue-100 active:scale-[0.98] transition text-center"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-blue-500 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0z"/>
            </svg>
            <span class="text-sm text-blue-700 font-semibold">Chụp ảnh trực tiếp</span>
            <span class="text-xs text-blue-400 mt-0.5">mở camera</span>
          </button>

          <!-- Nút CHỌN TỪ THƯ VIỆN / kéo thả -->
          <label
            @dragover.prevent="keoVao = true"
            @dragleave.prevent="keoVao = false"
            @drop.prevent="keoVao = false; xuLyFile($event.dataTransfer.files)"
            @click="if (thuVienBC.length) { $event.preventDefault(); moBC = true; }"
            :class="keoVao ? 'border-blue-400 bg-blue-50' : 'border-slate-300 bg-slate-50'"
            class="flex flex-col items-center justify-center rounded-2xl border-2 border-dashed px-3 py-6 cursor-pointer hover:bg-slate-100 transition text-center"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-slate-400 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5V18a2.25 2.25 0 002.25 2.25h13.5A2.25 2.25 0 0021 18v-1.5M16.5 7.5L12 3m0 0L7.5 7.5M12 3v13.5"/>
            </svg>
            <span class="text-sm text-slate-600 font-medium" x-text="thuVienBC.length ? 'Chọn từ ảnh báo cáo' : 'Chọn từ thư viện'"></span>
            <span class="text-xs text-slate-400 mt-0.5" x-text="thuVienBC.length ? (thuVienBC.length + ' ảnh ngày ' + ngayBCVN() + ' · tick chọn') : 'hoặc kéo thả'"></span>
            <input
              x-ref="fileInput"
              type="file"
              accept="image/*,video/*"
              multiple
              class="hidden"
              @change="xuLyFile($event.target.files)"
            />
          </label>
        </div>

        <!-- Ảnh bằng chứng đang được chụp ở dashboard (form mở trước cho nhanh, ảnh về sau vài giây) -->
        <div x-show="dangChupBC" x-cloak class="mt-3 flex items-center gap-2 rounded-2xl bg-blue-50 border border-blue-200 px-4 py-2.5">
          <span class="inline-block w-4 h-4 border-2 border-blue-500 border-t-transparent rounded-full animate-spin"></span>
          <span class="text-sm text-blue-700">Đang chụp ảnh pop-up làm bằng chứng…</span>
        </div>

        <!-- Đã đính kèm: đếm + xem lại (chạm để phóng to / phát clip) -->
        <div x-show="files.length > 0" x-cloak class="mt-3">
          <p class="text-xs font-medium text-slate-600 mb-1.5"
             x-text="'Đã đính kèm ' + files.length + ' ảnh/clip — chạm để xem lại'"></p>
          <div class="grid grid-cols-3 gap-2">
            <template x-for="(f, i) in files" :key="i">
              <div class="relative group">
                <button type="button" @click="xemMedia = f"
                  class="block w-full h-24 rounded-xl border border-slate-200 overflow-hidden bg-slate-100 relative active:scale-[0.98] transition">
                  <template x-if="f.loai === 'image'">
                    <img :src="f.preview" class="w-full h-full object-cover" />
                  </template>
                  <template x-if="f.loai === 'video'">
                    <span class="block w-full h-full bg-slate-800 relative">
                      <video :src="f.preview" playsinline webkit-playsinline class="absolute inset-0 w-full h-full object-cover opacity-70" muted preload="metadata"></video>
                      <span class="absolute inset-0 flex items-center justify-center">
                        <svg class="w-8 h-8 text-white drop-shadow" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                      </span>
                    </span>
                  </template>
                  <!-- số thứ tự -->
                  <span class="absolute bottom-1 left-1 text-[10px] font-semibold text-white bg-black/55 rounded px-1.5 py-0.5" x-text="(i+1)"></span>
                </button>
                <!-- Nút xoá -->
                <button type="button" @click="xoaFile(i)"
                  class="absolute -top-2 -right-2 w-6 h-6 rounded-full bg-red-500 text-white text-xs flex items-center justify-center shadow hover:bg-red-600 z-10"
                >✕</button>
              </div>
            </template>
          </div>
        </div>
      </div>

      

      <!-- ===== Modal CAMERA: chụp ảnh / quay video trực tiếp ===== -->
      <div x-show="dangChupAnh" x-cloak class="fixed inset-0 z-50 bg-black/90 flex flex-col p-3"
           style="padding-top:calc(env(safe-area-inset-top,0px) + 12px); padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px)">
        <!-- Chuyển chế độ Ảnh / Video (cố định trên) -->
        <div class="shrink-0 flex justify-center">
          <div class="flex gap-1 mb-2 bg-white/10 rounded-full p-1" :class="dangQuay ? 'opacity-40 pointer-events-none' : ''">
            <button type="button" @click="datCheDo(false)"
              :class="!cheDoVideo ? 'bg-white text-slate-800' : 'text-white'"
              class="rounded-full px-4 py-1.5 text-sm font-medium transition">Ảnh</button>
            <button type="button" @click="datCheDo(true)"
              :class="cheDoVideo ? 'bg-white text-slate-800' : 'text-white'"
              class="rounded-full px-4 py-1.5 text-sm font-medium transition">Video</button>
          </div>
        </div>

        <!-- Khung camera CO GIÃN: luôn chừa chỗ cho nút bên dưới, không tràn màn hình -->
        <div class="flex-1 min-h-0 flex items-center justify-center overflow-hidden my-1">
          <!-- playsinline + webkit-playsinline + muted: khoá iOS không cho nhảy Fullscreen Player đè mất nút Chụp/Xong -->
          <video x-ref="video" playsinline webkit-playsinline autoplay muted class="max-w-full max-h-full rounded-2xl bg-black object-contain"></video>
          <canvas x-ref="canvas" class="hidden"></canvas>
        </div>

        <!-- Trạng thái + nút điều khiển: LUÔN hiển thị, không bị che -->
        <div class="shrink-0">
        <!-- Đồng hồ khi đang quay -->
        <p x-show="dangQuay" x-cloak class="mb-1 text-red-400 text-sm font-semibold flex items-center justify-center gap-2">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse"></span>
          <span x-text="'Đang quay ' + Math.floor(giayQuay/60) + ':' + String(giayQuay%60).padStart(2,'0')"></span>
        </p>
        <p x-show="!dangQuay" class="text-white/70 text-xs mb-1 text-center"
           x-text="soAnhChup > 0 ? ('Đã ghi ' + soAnhChup + ' mục — bấm Xong khi đủ') : (cheDoVideo ? 'Bấm nút đỏ để bắt đầu quay (1080p)' : 'Đưa camera vào đối tượng rồi bấm Chụp')"></p>

        <div class="flex items-center justify-center gap-4 mt-2">
          <button type="button" @click="dongChupAnh()" x-show="!dangQuay"
            class="rounded-2xl bg-white/20 text-white font-medium px-5 py-3 text-sm hover:bg-white/30 transition">Xong</button>

          <!-- Nút chính: chụp ảnh / quay / dừng -->
          <template x-if="!cheDoVideo">
            <button type="button" @click="chupAnh()"
              class="rounded-full bg-white w-16 h-16 flex items-center justify-center shadow-lg ring-4 ring-white/40 active:scale-95 transition">
              <span class="block w-12 h-12 rounded-full bg-blue-600"></span>
            </button>
          </template>
          <template x-if="cheDoVideo">
            <button type="button" @click="dangQuay ? dungQuay() : batDauQuay()"
              class="rounded-full bg-white w-16 h-16 flex items-center justify-center shadow-lg ring-4 ring-white/40 active:scale-95 transition">
              <span x-show="!dangQuay" class="block w-12 h-12 rounded-full bg-red-600"></span>
              <span x-show="dangQuay" x-cloak class="block w-7 h-7 rounded bg-red-600"></span>
            </button>
          </template>

          <button type="button" @click="doiCamera()" x-show="!dangQuay"
            class="rounded-2xl bg-white/20 text-white font-medium px-4 py-3 text-sm hover:bg-white/30 transition" title="Đổi camera trước/sau">⇄</button>
          </div>
        </div>
      </div>

      <!-- ===== Overlay tiến trình nén video tải lên ===== -->
      <div x-show="dangNen" x-cloak class="fixed inset-0 z-50 bg-black/80 flex flex-col items-center justify-center p-6 text-center">

    function auditForm() {
      return {
        // ---- Trạng thái dữ liệu ----
        form: { hienTrang: '', viTri: '', maSanPham: '', hangMuc: '', nhanVienViPham: '', nhanVienViPhamList: [] },
        hangDong: 3,        // số dòng ô Hiện trạng — nạp sẵn nhiều dòng thì nới ra để người dùng đọc hết trước khi gửi
        thuVienBC: [],      // ảnh báo cáo planogram của NGÀY (từ pop-up ô) — bộ chọn tick nhiều ảnh, thay cho chọn file máy
        nguoiBC: '', ngayBC: '',
        moBC: false, chonBC: {}, daThemBC: {}, dangTaiBC: '',
        dangChupBC: false,  // ảnh chụp pop-up đang về (form mở trước, chụp chạy nền ở dashboard)
        _napSanFiles: [],   // file do nạp sẵn thêm vào (ảnh chụp pop-up) — mở tay mà chưa sửa gì thì gỡ theo
        dsHangMuc: DANH_SACH_5S.slice(),  // hạng mục hiển thị (reactive) — tải từ QUY-DINH lúc mở form
        files: [],          // danh sách file ảnh/video kèm preview
        xemMedia: null,     // ảnh/clip đang xem phóng to (Mục 4)
        tuKhoa: '',         // từ khoá đang gõ ở mục 3
        moDropdown: false,
        tuKhoaNV: '',       // từ khoá đang gõ ở mục 6
        moDropdownNV: false,
        dangQuet: false,    // đang bật camera quét mã?
        keoVao: false,      // đang kéo file vào vùng thả?
        dangGui: false,
        thongBao: { loai: '', noiDung: '' },
        _scanner: null,     // đối tượng camera quét mã
        dangChupAnh: false, // đang mở camera?
        _cameraStream: null,// luồng camera đang dùng
        soAnhChup: 0,       // số ảnh/clip đã ghi trong phiên camera này
        cameraSau: true,    // true = camera sau (environment), false = camera trước
        cheDoVideo: false,  // false = chụp ảnh, true = quay video
        dangQuay: false,    // đang quay video?
        _recorder: null, _videoChunks: [], _quayTimer: null, giayQuay: 0,
        dangNen: false, tienTrinhNen: '',   // trạng thái nén video tải lên (50-100MB -> 720p)
        MAX_VIDEO_MB: 100,  // > 100MB: chặn; 50-100MB: tự hạ 720p; <=50MB: giữ nguyên
        NGUONG_NEN_MB: 50,
        MAX_ANH_PX: 1800,   // 17/09/2026: 2560 → 1800 + nén 0,78 (mỗi ảnh ~500 KB xuống ~160 KB) để GỬI nhanh — chữ trên tem/nhãn vẫn đọc rõ

        // ---- Mục 6: Lọc NV vi phạm (BẢO MẬT: CHỈ thả cuộn khi gõ từ khoá gần khớp) ----
        danhSachLocNV() {
          const k = (this.tuKhoaNV || '').toLowerCase().trim();
          if (!k) return []; // Không gõ từ khoá -> KHÔNG hiện danh sách
          return DANH_SACH_NV_170.filter(nv => {
            const nm = (nv.name || '').toLowerCase();
            const em = (nv.email || '').toLowerCase();
            const cd = (nv.code || '').toLowerCase();
            const dp = (nv.dept || '').toLowerCase();
            return nm.includes(k) || em.includes(k) || cd.includes(k) || dp.includes(k);
          });
        },
        chonNV(nv) {
          if (!this.form.nhanVienViPhamList) this.form.nhanVienViPhamList = [];
          const exists = this.form.nhanVienViPhamList.some(x => x.code === nv.code || x.email === nv.email);
          if (!exists) {
            this.form.nhanVienViPhamList.push({ name: nv.name, email: nv.email, code: nv.code, dept: nv.dept });
          }
          this.form.nhanVienViPham = this.form.nhanVienViPhamList.map(x => x.email || x.code).join(', ');
          this.tuKhoaNV = '';
          this.moDropdownNV = false;
        },
        xoaNV(idx) {
          if (this.form.nhanVienViPhamList && this.form.nhanVienViPhamList[idx]) {
            this.form.nhanVienViPhamList.splice(idx, 1);
            this.form.nhanVienViPham = this.form.nhanVienViPhamList.map(x => x.email || x.code).join(', ');
          }
        },

        // ---- Alpine tự gọi khi khởi tạo: tải hạng mục mới nhất từ QUY-DINH ----
        init() { this.taiHangMuc(); this.ngheNapSan(); },
        // Đọc tab QUY-DINH (gviz JSONP) -> lấy cột "QUY ĐỊNH CHI TIẾT" (index 1) các dòng có STT là số.
        // Thành công (>=5 mục) thì thay danh sách; lỗi/thiếu thì GIỮ danh sách dự phòng.
        taiHangMuc() {
          const cb = 'qd_' + Date.now();
          window[cb] = (resp) => {
            try {
              const rows = ((resp.table && resp.table.rows) || []).map(r => (r.c || []).map(c => c ? (c.v == null ? '' : c.v) : ''));
              const mucs = rows.filter(r => /^\d+$/.test(String(r[0]).trim()))
                               .map(r => String(r[1] || '').trim()).filter(Boolean);
              if (mucs.length >= 5) { this.dsHangMuc = ['Không phát sinh vi phạm hạng mục', ...mucs]; this.khopLaiHangMucSauTai(); }
            } catch (e) { /* giữ danh sách dự phòng */ }
            delete window[cb];
          };
          const s = document.createElement('script');
          s.src = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?sheet=' +
                  encodeURIComponent(TAB_QUY_DINH) + '&headers=1&tqx=out:json;responseHandler:' + cb;
          s.onerror = () => { delete window[cb]; };
          document.body.appendChild(s);
          setTimeout(() => s.remove(), 30000);
        },

        // ---- NẠP SẴN từ dashboard (17/09/2026): pop-up ô ở tab Planogram soạn Vị trí + Hiện trạng; khi "có đi làm mà
        // KHÔNG báo cáo" thì kèm luôn Hạng mục vệ sinh + ảnh CHỤP POP-UP; các ca còn lại kèm THƯ VIỆN ảnh báo cáo của ngày
        // để người dùng tick 1 hay nhiều ảnh vi phạm (hạng mục tự chọn). ----
        // Bắt tay: form bắn 'ghi5s-san-sang' lên parent lúc khởi tạo; parent gửi 'ghi5s-nap-san' {du}
        // (hoặc 'ghi5s-xoa-nap-san' khi người dùng mở form TAY — trả form về trắng nếu họ chưa sửa gì).
        // Chỉ nhận tin từ đúng cửa sổ cha (e.source === window.parent) — không nhận từ frame/tab khác.
        _napSan: null,        // bản vừa nạp {viTri, hienTrang, hangMuc} để biết người dùng đã sửa hay chưa
        _napSanHM: '',        // hạng mục xin nạp mà chưa khớp được — khớp lại khi QUY-DINH về muộn hơn tin nạp
        ngheNapSan() {
          if (window.parent === window) return;   // mở thẳng form.html: không có ai để bắt tay
          window.addEventListener('message', (e) => {
            if (e.source !== window.parent) return;
            const d = e.data || {};
            if (d.type === 'ghi5s-nap-san') this.napSan(d.du || {});
            else if (d.type === 'ghi5s-them-anh') this.themAnhChup(d.anh, d.loi);
            else if (d.type === 'ghi5s-xoa-nap-san') this.xoaNapSan();
          });
          try { window.parent.postMessage({ type: 'ghi5s-san-sang' }, '*'); } catch (e) { /* tín hiệu sẵn sàng, không mang dữ liệu */ }
        },
        // Khớp hạng mục xin nạp với danh sách đang có, 4 bậc lỏng dần: (1) đúng nguyên văn; (2) cùng phần đầu
        // câu (trước dấu ":" — vế sau hay được sửa chữ, ví dụ QUY-DINH đã thêm "và báo cáo" so với bản dự
        // phòng); (3) cùng nói về "vệ sinh … hằng ngày"; (4) không có → trả '' để người dùng tự chọn.
        // So sánh sau khi bỏ dấu + gộp khoảng trắng để dấu gõ khác (hằng/hàng, NFC/NFD) không làm rơi mục.
        // KHÔNG gán chữ tự do: bộ đẩy khớp TYPE00 theo đúng tên mục trong workflow.
        khopHangMuc(txt) {
          const chuan = (s) => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D')
                                .toLowerCase().replace(/\s+/g, ' ').trim();
          const t = chuan(txt); if (!t) return '';
          const ds = this.dsHangMuc || [];
          let hit = ds.find(m => chuan(m) === t);
          if (!hit) { const dau = t.split(':')[0]; if (dau && dau.length >= 12) hit = ds.find(m => chuan(m).split(':')[0] === dau); }
          if (!hit && /ve sinh/.test(t)) hit = ds.find(m => /ve sinh.*hang ngay/.test(chuan(m)));
          return hit || '';
        },
        napSan(du) {
          const hm = du.hangMuc ? this.khopHangMuc(du.hangMuc) : '';   // không có hạng mục xin nạp → để trống cho người chọn
          this._napSanHM = (du.hangMuc && !hm) ? String(du.hangMuc) : '';
          // 22/09/2026 — NV vi phạm điền sẵn từ pop-up Planogram (ca "đi làm mà KHÔNG báo cáo ô này").
          // Pop-up bản cũ không gửi trường này → danh sách rỗng, người dùng tự chọn như trước.
          const dsNV = (Array.isArray(du.nvViPham) ? du.nvViPham : []).filter(x => x && (x.email || x.code));
          this.form = {
            hienTrang: String(du.hienTrang || ''),
            viTri: String(du.viTri || ''),
            maSanPham: String(du.maSanPham || ''),
            hangMuc: hm,
            nhanVienViPhamList: dsNV.map(x => ({ name: x.name || x.email || x.code, email: x.email || '', code: x.code || '', dept: x.dept || '' })),
            nhanVienViPham: dsNV.map(x => x.email || x.code).join(', ')
          };
          this.tuKhoa = ''; this.moDropdown = false;
          this.hangDong = Math.min(10, Math.max(3, this.form.hienTrang.split('\n').length + 1));
          // Ảnh nạp sẵn (ảnh CHỤP POP-UP làm bằng chứng): gỡ bản nạp cũ rồi thêm bản mới; KHÔNG gắn nhãn giờ (không phải ảnh hiện trường)
          this._goFileNapSan();
          for (const a of (du.anh || [])) {
            if (!a || !a.base64) continue;
            const f = { ten: a.ten || 'Screenshot.jpg', loai: 'image', mime: a.mime || 'image/jpeg', preview: a.base64, base64: a.base64, tg: a.tg || Date.now(), napSan: true };
            this.files.push(f); this._napSanFiles.push(f);
          }

        async _batCamera() {

        // Vẽ nhãn lên GÓC PHẢI-TRÊN ảnh — bê nguyên thiết kế tiêu đề "Viên nhãn" (chip AUDIT
        // nền xanh + HASAKI / Kiểm soát kho xếp chồng), DƯỚI là nhãn thời gian. Cả cụm CĂN LỀ PHẢI.
        // KHÔNG tô nền: làm "chìm" bằng độ trong + bóng đổ mảnh để vẫn đọc được trên mọi ảnh.
        _veNhanThoiGian(canvas, ts) {
          const ctx = canvas.getContext('2d');
          const W = canvas.width;
          const fs = Math.max(14, Math.round(W * 0.026));            // cỡ chữ nền tảng theo bề ngang ảnh

          const FONT = 'Inter, Arial, sans-serif';                    // đồng bộ font với tiêu đề dashboard

          ctx.font = '500 ' + subFs + 'px ' + FONT; const wSub = ctx.measureText('Kiểm soát kho').width;
          const txW = Math.max(wHASAKI, wSub);
          ctx.font = '800 ' + chipFs + 'px ' + FONT; const wChipTxt = ctx.measureText('AUDIT').width;
          const cpx = Math.round(chipFs * 0.6), cpy = Math.round(chipFs * 0.34);

          const gap = Math.round(fs * 0.5), lh = Math.round(tFs * 1.08);

          const ty = y0 + Math.round((rowH - txH) / 2);

          ctx.fillText('HASAKI', txX, ty);
          ctx.font = '500 ' + subFs + 'px ' + FONT; ctx.fillStyle = 'rgba(255,255,255,0.78)';

          const time = this._thoiGianNhan(ts);
          const tmFs = Math.round(fs * 1.56);
          ctx.font = '600 ' + tmFs + 'px ' + FONT;
          const tw = ctx.measureText(time).width;
          ctx.fillStyle = '#ffffff';

          ctx.restore();
        },
        // ---- Lấy THỜI GIAN CHỤP/QUAY GỐC của tệp tải lên (EXIF ảnh / mvhd video) ----

                const u16 = (p) => dv.getUint16(p, le), u32 = (p) => dv.getUint32(p, le);
                const docIFD = (ifd, tagCan) => {
                  const n = u16(ifd);

        // MP4/MOV: creation_time trong box 'mvhd' (giây từ 1904-01-01).
        _mvhdDate(dv) {
          try {
            for (let i = 0; i + 24 < dv.byteLength; i++) {
              if (dv.getUint8(i) === 0x6D && dv.getUint8(i + 1) === 0x76 && dv.getUint8(i + 2) === 0x68 && dv.getUint8(i + 3) === 0x64) {   // "mvhd"
                const ver = dv.getUint8(i + 4);
                const sec = ver === 1 ? dv.getUint32(i + 8) * 4294967296 + dv.getUint32(i + 12) : dv.getUint32(i + 8);
                const t = (sec - 2082844800) * 1000;                            // 1904 -> 1970
                if (t > 946684800000 && t < Date.now() + 86400000) return t;
              }
            }
          } catch (e) {}
          return null;
        },
        dongChupAnh() {
          if (this.dangQuay) this.dungQuay();
          if (this._cameraStream) { this._cameraStream.getTracks().forEach(t => t.stop()); this._cameraStream = null; }
          if (this.$refs.video) this.$refs.video.srcObject = null;
          this.dangChupAnh = false;
        },

        // ---- Mục 4: Xử lý file ảnh/video ----
        xuLyFile(fileList) {
          for (const file of Array.from(fileList)) {
            if ((file.type || '').startsWith('video')) this._themVideo(file);
            else this._themAnh(file);
          }
        },
        // Ảnh: thu nhỏ về <=2K + gắn nhãn thời gian (ưu tiên EXIF thời gian CHỤP gốc) + nén JPEG
        async _themAnh(file) {
          const tg = await this._thoiGianChup(file);           // EXIF DateTimeOriginal -> lastModified
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
              const max = this.MAX_ANH_PX;
              if (Math.max(w, h) > max) { const s = max / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
              const c = document.createElement('canvas'); c.width = w; c.height = h;
              c.getContext('2d').drawImage(img, 0, 0, w, h);
              this._veNhanThoiGian(c, tg);   // ảnh tải lên: dùng thời gian gốc của ảnh
              const dataUrl = c.toDataURL('image/jpeg', 0.78);
              this.files.push({ ten: (file.name || 'anh').replace(/\.[^.]+$/, '') + '.jpg', loai: 'image', mime: 'image/jpeg', preview: dataUrl, base64: dataUrl, tg });
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        },
        // Video THƯ VIỆN: KHÔNG gắn nhãn (giữ nguyên gốc) — nhãn thời gian chỉ ghi đè lên
        // ảnh/clip ghi nhận TRỰC TIẾP và ẢNH tải từ thư viện. <=50MB gửi nguyên; 50-100MB hạ 720p; >100MB chặn.
        async _themVideo(file) {
          const tg = await this._thoiGianChup(file);   // vẫn đọc mvhd để tính "Thời gian vi phạm"
          const mb = file.size / (1024 * 1024);
          if (mb > this.MAX_VIDEO_MB) {
            alert('Video nặng ' + mb.toFixed(0) + 'MB, vượt giới hạn ' + this.MAX_VIDEO_MB + 'MB.\nVui lòng quay clip ngắn hơn.');
            return;
          }
          let blob = file;
          if (mb > this.NGUONG_NEN_MB) {
            try { this.dangNen = true; blob = await this._nenVideo720(file); }
            catch (err) { alert('Không nén được video, gửi nguyên gốc. (' + err + ')'); blob = file; }
            finally { this.dangNen = false; this.tienTrinhNen = ''; }
          }
          const reader = new FileReader();
          reader.onload = (e) => {
            this.files.push({ ten: file.name || 'video.mp4', loai: 'video', mime: (blob.type || file.type || 'video/mp4').split(';')[0],
              preview: URL.createObjectURL(blob),    // objectURL: phát mượt, không rách như data: URL lớn
              base64: e.target.result, tg });
          };
          reader.readAsDataURL(blob);
        },
        // Hạ ≤720p bằng canvas (chỉ dùng cho clip thư viện >50MB) — KHÔNG gắn nhãn, giữ âm thanh nếu trình duyệt cho phép
        _nenVideo720(file) {
          return new Promise((resolve, reject) => {
            const v = document.createElement('video');
            v.muted = true; v.playsInline = true; v.src = URL.createObjectURL(file);
            v.onloadedmetadata = () => {
              const scale = Math.min(1, 1280 / Math.max(v.videoWidth, v.videoHeight));
              const w = Math.round(v.videoWidth * scale), h = Math.round(v.videoHeight * scale);
              const c = document.createElement('canvas'); c.width = w; c.height = h;
              const ctx = c.getContext('2d');
              const cs = c.captureStream(30);
              try { const vs = v.captureStream ? v.captureStream() : null; if (vs) vs.getAudioTracks().forEach(t => cs.addTrack(t)); } catch (e) {}
              const mime = ['video/mp4;codecs=h264', 'video/webm;codecs=vp9', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m)) || '';
              const rec = new MediaRecorder(cs, mime ? { mimeType: mime, videoBitsPerSecond: 2500000 } : undefined);
              const chunks = [];
              rec.ondataavailable = (ev) => { if (ev.data && ev.data.size) chunks.push(ev.data); };
              rec.onstop = () => { URL.revokeObjectURL(v.src); resolve(new Blob(chunks, { type: (rec.mimeType || 'video/webm').split(';')[0] })); };
              let raf;
              const draw = () => { if (!v.paused && !v.ended) {
                ctx.drawImage(v, 0, 0, w, h);
                this.tienTrinhNen = 'Đang nén video... ' + Math.round((v.currentTime / (v.duration || 1)) * 100) + '%';
                raf = requestAnimationFrame(draw); } };
              rec.start();
              v.play().then(() => draw()).catch(reject);
              v.onended = () => { cancelAnimationFrame(raf); setTimeout(() => { try { rec.stop(); } catch (e) {} }, 200); };
            };
            v.onerror = () => reject('không mở được video');
          });
        },
        xoaFile(i) {
          const f = this.files[i];
          if (f && /^blob:/.test(String(f.preview))) { try { URL.revokeObjectURL(f.preview); } catch (e) {} }
          this.files.splice(i, 1);
        },

        // ---- Gửi báo cáo ----
        async guiBaoCao() {
          this.thongBao = { loai: '', noiDung: '' };

          // Kiểm tra các mục bắt buộc (*)
          if (!this.form.viTri.trim()) {
            this.thongBao = { loai: 'err', noiDung: 'Vui lòng nhập Khu vực / vị trí ghi nhận (Mục 2).' };
            return;
          }
          if (!this.form.hangMuc.trim()) {
            this.thongBao = { loai: 'err', noiDung: 'Vui lòng chọn Hạng mục 5S (Mục 4).' };
            return;
          }
          // Ảnh chụp pop-up đang về (dashboard chụp nền) → ĐỪNG bắt người dùng bấm lại: chờ hộ tối đa 25 s rồi gửi luôn.
          if (this.dangChupBC && !this.files.length) {
            this.dangGui = true;
            this.thongBao = { loai: 'info', noiDung: 'Đang chờ ảnh pop-up chụp xong rồi gửi ngay…' };
            const t0 = Date.now();
            while (this.dangChupBC && !this.files.length && Date.now() - t0 < 25000) await new Promise(r => setTimeout(r, 120));
            this.dangGui = false;
            if (this.thongBao.loai === 'info') this.thongBao = { loai: '', noiDung: '' };
          }
          if (this.files.length === 0) {
            this.thongBao = { loai: 'err', noiDung: 'Vui lòng đính kèm ít nhất 1 hình ảnh / clip (Mục 5).' };
            return;
          }
          if (this.dangNen) {
            this.thongBao = { loai: 'err', noiDung: 'Đang xử lý video, vui lòng đợi giây lát rồi gửi lại.' };
            return;
          }

          this.dangGui = true;

          // Thời gian vi phạm = mốc thời gian sớm nhất của ảnh/video; nếu không có thì = lúc gửi form
          const mocs = this.files.map(f => f.tg).filter(Boolean);
          const tgViPham = mocs.length ? Math.min(...mocs) : Date.now();
          const p = (n) => String(n).padStart(2, '0');
          const d = new Date(tgViPham);
          const thoiGianViPham = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' +
                                 p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());

          // Chuẩn bị thông tin nhân viên vi phạm (gộp danh sách chọn + từ khoá nhập tay)
          let nvVal = (this.form.nhanVienViPhamList || []).map(x => x.email || x.code).join(', ');
          if (!nvVal && this.tuKhoaNV && this.tuKhoaNV.trim()) nvVal = this.tuKhoaNV.trim();

          // Gói dữ liệu gửi sang Google Apps Script
          const duLieu = {
            hienTrang: this.form.hienTrang.trim(),
            viTri: this.form.viTri.trim(),
            maSanPham: this.form.maSanPham.trim(),
            hangMuc: this.form.hangMuc.trim(),
            nhanVienViPham: nvVal,
            thoiGianViPham: thoiGianViPham,
            // CHỈ gửi phần base64 THUẦN (cắt tiền tố data:...;base64,) — mime clip quay trực tiếp
            // có dấu phẩy (vd video/mp4;codecs=h264,aac) làm máy chủ split(',') giải mã sai chuỗi.
            hinhAnh: this.files.map(f => {
              const b64 = String(f.base64 || '');
              const v = b64.indexOf('base64,');
              return { ten: f.ten, mime: f.mime, base64: v >= 0 ? b64.slice(v + 7) : b64 };
            })
          };

          try {
            // Dùng Content-Type text/plain để tránh lỗi CORS preflight với Apps Script
            const goi = fetch(WEBHOOK_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify(duLieu),
              signal: (typeof AbortSignal !== 'undefined' && AbortSignal.timeout) ? AbortSignal.timeout(90000) : undefined
            });
            /* GỬI "TỨC THÌ" (17/09/2026 — user: "ép xuống tức thì"): Apps Script trả lời sau 7-40 giây, nhưng dữ liệu
               đã rời máy ngay khi request phát đi. Không bắt thủ kho đứng nhìn màn hình chờ: báo NGAY là đã gửi,
               vẫn theo tới cùng ở nền và cập nhật lại khi máy chủ xác nhận (hoặc báo đỏ + giữ nguyên nội dung để
               gửi lại nếu hỏng). Chờ 250 ms trước khi báo để lỗi mạng tức thời (mất sóng) vẫn hiện ra là LỖI. */
            const som = await Promise.race([goi.then(() => 'xong', () => 'loi'), new Promise(r => setTimeout(() => r('cho'), 250))]);
            if (som === 'cho') {
              this.thongBao = { loai: 'info', noiDung: '✓ Đã gửi báo cáo — đang lưu lên hệ thống. Bạn đóng form được rồi.' };
              this.dangGui = false;
            }
            const res = await goi;
            const ketQua = await res.json();

            if (ketQua.status === 'success') {
              this.thongBao = { loai: 'ok', noiDung: '✓ Gửi báo cáo thành công! Dữ liệu đã được lưu.' };
              // Reset form sau khi gửi
              this.form = { hienTrang: '', viTri: '', maSanPham: '', hangMuc: '', nhanVienViPham: '', nhanVienViPhamList: [] };
              this.tuKhoa = ''; this.tuKhoaNV = ''; this.hangDong = 3; this._napSan = null; this._napSanHM = '';
              this.files = []; this._napSanFiles = []; this.thuVienBC = []; this.chonBC = {}; this.daThemBC = {};
            } else {
              throw new Error(ketQua.message || 'Lỗi không xác định từ máy chủ.');
            }
          } catch (err) {
            /* Báo "đã gửi" rồi mà hỏng thì PHẢI nói rõ là chưa lưu được — nội dung vẫn còn nguyên để bấm gửi lại. */
            this.thongBao = { loai: 'err', noiDung: '✗ CHƯA lưu được: ' + err.message + ' — nội dung vẫn còn, bấm GỬI BÁO CÁO để thử lại.' };
          } finally {
            this.dangGui = false;
          }
        }
      };
    }
  </script>
